<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Thorrija</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="admin-login">
        <div class="admin-login-card">
            <h1>Panel de administración</h1>
            <p class="admin-login-subtitle">Acceso restringido</p>
            <form id="loginForm" class="admin-login-form">
                <div class="field">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" required autocomplete="username" placeholder="admin@email.com">
                </div>
                <div class="field">
                    <label for="adminPassword">Contraseña</label>
                    <input type="password" id="adminPassword" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <span id="loginBtnText">Iniciar sesión</span>
                </button>
            </form>
            <a class="admin-back" href="index.html">← Volver al portfolio</a>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel hidden">
        <header class="admin-header">
            <div class="admin-header-content">
                <div>
                    <h1 class="admin-title">Mensajes</h1>
                    <p class="admin-subtitle">Formulario de contacto del portfolio</p>
                </div>
                <div class="admin-actions">
                    <button onclick="logout()" class="btn btn-ghost">Cerrar sesión</button>
                </div>
            </div>
        </header>

        <div class="admin-content">
            <div class="stat-card">
                <h3>Total mensajes</h3>
                <p class="stat-value" id="totalMessages">0</p>
            </div>

            <div id="messagesContainer" class="messages-container">
                <div class="loading-spinner">Cargando mensajes…</div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
        <div class="toast-content">
            <h4 id="toastTitle"></h4>
            <p id="toastMessage"></p>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
